<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colour Jeopardy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2d2d44);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
  }
  h1 { font-size: 5rem; margin-bottom: 8px; line-height: 1.1; text-align: center; }
  p.sub { opacity: .75; margin-bottom: 20px; }

  #timer {
    font-size: 4rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-bottom: 24px;
    padding: 10px 40px;
    border-radius: 16px;
    background: rgba(255,255,255,.08);
    min-width: 260px;
    text-align: center;
    transition: color .3s, background .3s;
  }
  #timer.warning { color: #ffcc00; }
  #timer.done { color: #fff; background: #e53935; animation: pulse .5s ease-in-out 10; }
  @keyframes pulse { 50% { transform: scale(1.08); } }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 240px);
    gap: 28px;
  }
  @media (max-width: 820px) { .grid { grid-template-columns: repeat(2, 200px); } }
  @media (max-width: 460px) { .grid { grid-template-columns: 1fr; } }

  .card { height: 300px; perspective: 1000px; cursor: pointer; }
  .inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .8s;
    transform-style: preserve-3d;
  }
  .card.flipped .inner { transform: rotateY(180deg); }
  .card:not(.flipped):hover .inner { transform: translateY(-6px); }

  .face {
    position: absolute; inset: 0;
    border-radius: 20px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .front { font-size: 2rem; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .back {
    transform: rotateY(180deg);
    background: #fff; color: #222;
    font-size: 1.45rem; font-weight: 600; line-height: 1.4;
    border: 10px solid;
  }

  #wheelBox {
    position: absolute; top: 20px; right: 20px;
    width: 220px; text-align: center;
  }
  #wheel {
    width: 220px; height: 220px; cursor: pointer; display: block;
    border-radius: 50%;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    transition: transform 4.5s cubic-bezier(.17,.67,.12,.99);
  }
  #pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; z-index: 2;
    border-left: 14px solid transparent; border-right: 14px solid transparent;
    border-top: 26px solid #fff;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.5));
  }
  #winner { margin-top: 12px; font-size: 1.2rem; font-weight: 700; min-height: 1.5em; }
  #winner.show { animation: pop .5s ease-out; color: #ffd54f; font-size: 1.6rem; }
  @keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
  @media (max-width: 1300px) {
    #wheelBox { position: static; margin-bottom: 20px; }
  }

  button#reset {
    margin-top: 30px; padding: 12px 28px;
    font-size: 1rem; font-weight: 600;
    border: none; border-radius: 30px;
    background: #fff; color: #222; cursor: pointer;
  }
  button#reset:hover { background: #ddd; }
</style>
</head>
<body>
  <div id="wheelBox">
    <div id="pointer"></div>
    <canvas id="wheel" width="440" height="440" title="Click to spin"></canvas>
    <div id="winner">Click the wheel to spin!</div>
  </div>
  <h1>🎨 Colour Jeopardy</h1>
  <p class="sub">Pick a card – you have 45 seconds!</p>
  <div id="timer">0:45</div>
  <div class="grid" id="grid"></div>
  <button id="reset">Reset all cards</button>

<script>
  const cards = [
    { name: "Blue",   color: "#1e88e5", text: "Find the most random blue object" },
    { name: "Green",  color: "#43a047", text: "Find the most expensive green object" },
    { name: "Yellow", color: "#fdd835", text: "Find the most useless yellow object" },
    { name: "Red",    color: "#e53935", text: "Find the cheapest red object" },
    { name: "Pink",   color: "#ec407a", text: "Find the most useful pink object" },
    { name: "Purple", color: "#8e24aa", text: "Find the most Hubbery purple object" },
  ];

  const grid = document.getElementById("grid");
  const timerEl = document.getElementById("timer");
  const DURATION = 45;
  let remaining = DURATION, intervalId = null, audioCtx = null;
  let musicGain = null, musicTimeout = null;

  const N = { G2:98, C3:130.81, D3:146.83, G3:196, A3:220, G4:392, A4:440, B4:493.88,
              C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880, B5:987.77, C6:1046.5 };
  const EIGHTH = 0.15;
  const melody = [
    "G4","C5","E5","G5", "E5","C5","G4",null,
    "A4","D5","F5","A5", "F5","D5","A4",null,
    "G4","C5","E5","G5", "C6","B5","A5","G5",
    "F5","E5","D5","B4", "C5",null,"SLIDE",null,
  ];
  const bass = ["C3","G3","C3","G3","D3","A3","D3","A3","C3","G3","C3","G3","G2","D3","C3","G3"];

  function tone(freq, start, dur, type, vol) {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(g).connect(musicGain);
    osc.start(start);
    osc.stop(start + dur + 0.02);
    return osc;
  }

  function playMusicLoop() {
    const t0 = audioCtx.currentTime + 0.05;
    melody.forEach((n, i) => {
      const t = t0 + i * EIGHTH;
      if (n === "SLIDE") {
        // slide-whistle "woop"
        const o = tone(400, t, EIGHTH * 2, "sine", 0.25);
        o.frequency.setValueAtTime(400, t);
        o.frequency.exponentialRampToValueAtTime(1400, t + EIGHTH * 2);
      } else if (n) {
        tone(N[n], t, EIGHTH * 0.8, "square", 0.08);
      }
    });
    bass.forEach((n, i) => tone(N[n], t0 + i * EIGHTH * 2, EIGHTH * 1.2, "triangle", 0.25));
    musicTimeout = setTimeout(playMusicLoop, melody.length * EIGHTH * 1000);
  }

  function startMusic() {
    stopMusic();
    musicGain = audioCtx.createGain();
    musicGain.connect(audioCtx.destination);
    playMusicLoop();
  }

  function stopMusic() {
    clearTimeout(musicTimeout);
    if (musicGain) {
      const g = musicGain;
      g.gain.setValueAtTime(1, audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
      setTimeout(() => g.disconnect(), 100);
      musicGain = null;
    }
  }

  cards.forEach(c => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="inner">
        <div class="face front" style="background:${c.color}">${c.name}</div>
        <div class="face back" style="border-color:${c.color}">${c.text}</div>
      </div>`;
    card.addEventListener("click", () => {
      if (card.classList.contains("flipped")) return;
      card.classList.add("flipped");
      startTimer();
    });
    grid.appendChild(card);
  });

  function render() {
    const m = Math.floor(remaining / 60), s = remaining % 60;
    timerEl.textContent = `${m}:${String(s).padStart(2, "0")}`;
    timerEl.classList.toggle("warning", remaining <= 10 && remaining > 0);
  }

  function startTimer() {
    // Must create/resume audio inside a user click so browsers allow playback later
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();

    clearInterval(intervalId);
    remaining = DURATION;
    timerEl.classList.remove("done");
    render();
    startMusic();
    intervalId = setInterval(() => {
      remaining--;
      render();
      if (remaining <= 0) {
        clearInterval(intervalId);
        stopMusic();
        timerEl.textContent = "⏰ Time's up!";
        timerEl.classList.add("done");
        playAlarm();
      }
    }, 1000);
  }

  function playAlarm() {
    // Classic alarm-clock ring: rapid two-tone bursts for 5 seconds
    const now = audioCtx.currentTime, RING = 5, BEEP = 0.12;
    const master = audioCtx.createGain();
    master.gain.value = 0.3;
    master.connect(audioCtx.destination);
    for (let t = 0; t < RING; t += BEEP * 2) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = (Math.floor(t / (BEEP * 2)) % 2) ? 880 : 1040;
      const s = now + t;
      gain.gain.setValueAtTime(0.0001, s);
      gain.gain.exponentialRampToValueAtTime(1, s + 0.01);
      gain.gain.setValueAtTime(1, s + BEEP - 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, s + BEEP);
      osc.connect(gain).connect(master);
      osc.start(s);
      osc.stop(s + BEEP + 0.01);
    }
  }

  // ---- Name wheel ----
  const names = ["TJ","Emmanuel","Nerea","Alessandra","Marcio","Marta",
                 "Sebastién","Federico","Timo","Matteo","Judith"];
  const wheelColors = ["#1e88e5","#43a047","#fdd835","#e53935","#ec407a","#8e24aa"];
  const wheel = document.getElementById("wheel");
  const winnerEl = document.getElementById("winner");
  const SEG = 360 / names.length;
  let wheelRotation = 0, spinning = false;

  (function drawWheel() {
    const ctx = wheel.getContext("2d"), c = 220, r = 215;
    names.forEach((name, i) => {
      const a0 = (i * SEG) * Math.PI / 180, a1 = ((i + 1) * SEG) * Math.PI / 180;
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, a0, a1); ctx.closePath();
      ctx.fillStyle = wheelColors[i % wheelColors.length]; ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
      ctx.save();
      ctx.translate(c, c); ctx.rotate((a0 + a1) / 2);
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff"; ctx.font = "bold 26px 'Segoe UI', sans-serif";
      ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 4;
      ctx.fillText(name, r - 16, 0);
      ctx.restore();
    });
    ctx.beginPath(); ctx.arc(c, c, 28, 0, Math.PI * 2);
    ctx.fillStyle = "#fff"; ctx.fill();
  })();

  wheel.addEventListener("click", () => {
    if (spinning) return;
    spinning = true;
    winnerEl.classList.remove("show");
    winnerEl.textContent = "Spinning…";
    const idx = Math.floor(Math.random() * names.length);
    const jitter = (Math.random() - 0.5) * SEG * 0.7;
    // Pointer sits at the top (270° in canvas coordinates)
    const targetMod = ((270 - (idx + 0.5) * SEG - jitter) % 360 + 360) % 360;
    const base = wheelRotation - (wheelRotation % 360);
    wheelRotation = base + 360 * 5 + targetMod;
    wheel.style.transform = `rotate(${wheelRotation}deg)`;
    setTimeout(() => {
      spinning = false;
      winnerEl.textContent = `🎉 ${names[idx]}!`;
      void winnerEl.offsetWidth;
      winnerEl.classList.add("show");
    }, 4600);
  });

  document.getElementById("reset").addEventListener("click", () => {
    document.querySelectorAll(".card").forEach(c => c.classList.remove("flipped"));
    clearInterval(intervalId);
    if (audioCtx) stopMusic();
    remaining = DURATION;
    timerEl.classList.remove("done", "warning");
    render();
  });
</script>
</body>
</html>
